<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource">

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Ad </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <!-- Series Column -->
    <ng-container matColumnDef="series">
      <th mat-header-cell *matHeaderCellDef> Seri </th>
      <td mat-cell *matCellDef="let element"> {{element.series}} </td>
    </ng-container>

    <!-- Category Column -->
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef> Kategori </th>
      <td mat-cell *matCellDef="let element"> {{element.category}} </td>
    </ng-container>

    <!-- Price Column -->
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef> Fiyat </th>
      <td mat-cell *matCellDef="let element"> {{element.price | currency:'TRY':'symbol':'1.2-2'}} </td>
    </ng-container>

    <!-- Stock Column -->
    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef> Stok </th>
      <td mat-cell *matCellDef="let element"> {{element.stock}} </td>
    </ng-container>

    <!-- Color Column -->
    <ng-container matColumnDef="color">
      <th mat-header-cell *matHeaderCellDef> Renk </th>
      <td mat-cell *matCellDef="let element"> {{element.color}} </td>
    </ng-container>

    <!-- Edit Column -->
    <ng-container matColumnDef="photos">
      <th mat-header-cell *matHeaderCellDef style="width: 50px; text-align: center;">Image</th>
      <td mat-cell *matCellDef="let element" style="width: 50px; text-align: center; padding: 4px; ">
        <img src="../../../../../assets/imgupload.png" width="25" height="25" style="cursor: pointer;" (click)="addProductImages(element.id)">
      </td>
    </ng-container>


    <ng-container matColumnDef="edit">
      <th mat-header-cell *matHeaderCellDef> Edit </th>
      <td mat-cell *matCellDef="let element"> <img src="../../../../../assets/Editicon.png" width="25" height="25"
          style="cursor: pointer;">
      </td>
    </ng-container>

    <!-- Delete Column -->
    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef> Delete </th>
      <td mat-cell *matCellDef="let element" [id]="element.id" appDelete controller="Product" width="25" height="25"
        style="cursor: pointer;">
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" [length]="totalcount" showFirstLastButtons
    aria-label="Select page of products">
  </mat-paginator>
</div>
