<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource">

    <!-- Order Code Column -->
    <ng-container matColumnDef="orderCode">
      <th mat-header-cell *matHeaderCellDef> Order Code </th>
      <td mat-cell *matCellDef="let element"> {{element.orderCode}} </td>
    </ng-container>

    <!-- User Name Column -->
    <ng-container matColumnDef="userName">
      <th mat-header-cell *matHeaderCellDef> Kullanıcı adı </th>
      <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
    </ng-container>

    <!-- Total Price Column -->
    <ng-container matColumnDef="totalPrice">
      <th mat-header-cell *matHeaderCellDef> Toplam tutar </th>
      <td mat-cell *matCellDef="let element"> {{element.totalPrice}} </td>
    </ng-container>

    <ng-container matColumnDef="isCompleted">
      <th mat-header-cell *matHeaderCellDef>Sipariş Tamamlandı</th>
      <td mat-cell *matCellDef="let element">
        <img *ngIf="element.isCompleted" src="../../../../../../assets/completedpng.png" width="25" height="25"
          style="margin-left: 50px;">
      </td>
    </ng-container>

    <!-- Created Date Column -->
    <ng-container matColumnDef="createdDate">
      <th mat-header-cell *matHeaderCellDef> Oluşturulma tarihi</th>
      <td mat-cell *matCellDef="let element">
        {{element.createdDate | date:'dd/MM/yyyy HH:mm'}}
      </td>
    </ng-container>

    <!-- Edit Column -->
    <ng-container matColumnDef="viewDetail">
      <th mat-header-cell *matHeaderCellDef> Detay </th>
      <td mat-cell *matCellDef="let element">
        <img (click)="showDetail(element.id)" src="../../../../../assets/detail.png" width="25" height="25"
          style="cursor: pointer;">
      </td>
    </ng-container>

    <!-- Delete Column -->
    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef> Delete </th>
      <td mat-cell *matCellDef="let element" [id]="element.id" appDelete controller="orders" width="25" height="25"
        style="cursor: pointer;">
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" [length]="totalcount" showFirstLastButtons
    aria-label="Select page of orders">
  </mat-paginator>
</div>
