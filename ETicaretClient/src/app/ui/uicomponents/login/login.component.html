<div class="container login-container">
    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-6">
            <div class="login-card">
                <div class="login-header">
                    <h2>🔐 Hoş Geldiniz</h2>
                    <p>Hesabınıza giriş yapın</p>
                </div>
                <div class="login-body">
                    <div class="form-group">
                        <label class="form-label">
                            📧 E-posta Adresi
                        </label>
                        <input #txtEmail type="email" formControlName="email" class="form-control"
                            placeholder="ornek@email.com">
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            🔑 Şifre
                        </label>
                        <input #txtPassword type="password" formControlName="password" class="form-control"
                            id="passwordInput" placeholder="••••••••">
                    </div>
                    <div class="form-group form-check">
                        <input type="checkbox" formControlName="rememberMe" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            Beni Hatırla
                        </label>
                    </div>
                    <div class="google-signin-wrapper">
                        <asl-google-signin-button type='icon' size='medium' type='standard' size='large'
                            text='signin_with'></asl-google-signin-button>
                    </div>
                    <button type="submit" class="btn btn-primary"
                        (click)="login(txtEmail.value, txtPassword.value)">Giriş Yap</button>

                    <a class="btn btn-secondary" style="margin-left: 5px;" routerLink="/sifremiunuttum">Şifremi unuttum ?</a>
                </div>
            </div>
        </div>
    </div>
</div>
